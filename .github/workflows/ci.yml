name: CI (Python + Docker)

on:
  push:
  pull_request:

jobs:
  test-quiz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-quiz:ci -f ops/Dockerfile .

      - name: Run quiz container in background
        run: docker run -d --name devops-quiz-container -p 5000:5000 devops-quiz:ci

      - name: Wait for app to start
        run: sleep 5

      - name: Check health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Stop container
        run: docker stop devops-quiz-container