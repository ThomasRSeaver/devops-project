<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Quiz Preview</h1>
    <p class="subtitle">Mock interface for presentation purposes</p>

    <div class="layout">
      <div class="card main-card">
        <p class="question-number">Question 1</p>
        <h2>What does CI stand for?</h2>

        <div class="answers">
          <button>Continuous Integration</button>
          <button>Central Installation</button>
          <button>Code Isolation</button>
          <button>Continuous Inspection</button>
        </div>

        <div class="actions">
          <button class="secondary">Stop and Keep Money</button>
          <a class="button-link" href="index.html">Back</a>
        </div>
      </div>

      <div class="card side-card">
        <h3>Prize Ladder</h3>
        <ul class="ladder">
          <li>€160</li>
          <li>€80</li>
          <li class="active">€40</li>
          <li>€20</li>
          <li>€10</li>
        </ul>

        <h3>Status</h3>
        <p>Current prize: <strong>€10</strong></p>
        <p>Mode: Demo / Preview</p>
      </div>
    </div>
  </div>
</body>
</html>
