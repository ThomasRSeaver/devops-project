<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Quiz Preview</h1>
    <p class="subtitle">Mock interface for presentation purposes</p>

    <div class="layout">
      <div class="card main-card">
        <p class="question-number">Question 1</p>
        <h2>What does CI stand for?</h2>

    <div class="answers">
        <button class="answer" data-correct="true">Continuous Integration</button>
        <button class="answer" data-correct="false">Central Installation</button>
        <button class="answer" data-correct="false">Code Isolation</button>
        <button class="answer" data-correct="false">Continuous Inspection</button>
    </div>

    <p id="feedback"></p>

        <div class="actions">
          <button class="secondary">Stop and Keep Money</button>
          <a class="button-link" href="index.html">Back</a>
        </div>
      </div>

      <div class="card side-card">
        <h3>Prize Ladder</h3>
        <ul class="ladder" id="ladder">
            <li data-step="5">€160</li>
            <li data-step="4">€80</li>
            <li data-step="3">€40</li>
            <li data-step="2">€20</li>
            <li data-step="1" class="active">€10</li>
        </ul>

        <h3>Status</h3>
        <p>Current prize: <strong id="current-prize">€10</strong></p>
        <p>Mode: Demo / Preview</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

</body>
</html>
